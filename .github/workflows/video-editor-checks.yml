name: Video Editor Checks

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    paths:
      - "my-video/**"
      - ".github/workflows/video-editor-checks.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check server syntax
        run: node --check my-video/server.mjs
      - name: Install dependencies
        run: npm ci
        working-directory: my-video
      - name: Run composition regression tests
        run: npm test
        working-directory: my-video
